name: Publish

on:
  push:
    branches:
      - main
      - feature/DN-3920

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Increment Marketplace version
        run: |
          marketplace_version="$(
            npx --no-install vsce show amsuni.workflow-dev --json |
              node -e "let input = ''; process.stdin.on('data', chunk => input += chunk).on('end', () => { const value = input.trim(); if (value && value !== 'undefined') process.stdout.write(JSON.parse(value).versions?.[0]?.version ?? ''); })"
          )"
          if [[ ! "$marketplace_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Marketplace version: $marketplace_version" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$marketplace_version"
          npm version "$major.$minor.$((patch + 1))" --no-git-tag-version

      - name: Compile, lint, and test
        run: xvfb-run -a npm test

      - name: Package
        run: npx --no-install vsce package --out workflow-dev.vsix

      - name: Publish
        run: npx --no-install vsce publish --packagePath workflow-dev.vsix --oidc
